name: Daily Etihad fare check
on:
  schedule:
    - cron: "17 5 * * *"  # ~6am London during BST
    - cron: "17 6 * * *"  # ~6am London during GMT
  workflow_dispatch: {}    # lets you run it manually

permissions:
  contents: write          # needed to save docs/data.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python etihad_fare_alert.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Save results for the dashboard
        run: |
          git config user.name "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add docs/data.json docs/last_sent.txt
          git diff --cached --quiet || (git commit -m "Update fares" && git push)
