<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etihad fares to Cochin</title>
<style>
  :root {
    --bg:#141311; --bg2:#1c1a17; --card:#1f1d1a; --text:#f3eee3; --muted:#a39b8a;
    --gold:#c9a45c; --gold-light:#e6cb8f; --gold-dark:#8f6f2f; --line:#3a352c; --good:#7fd1a0;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; color:var(--text); min-height:100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 500px at 50% -10%, #2a2519 0%, var(--bg) 60%) fixed;
  }
  main { max-width: 780px; margin: 0 auto; padding: 36px 18px 70px; }
  header { text-align:center; padding-bottom: 6px; }
  .eyebrow { letter-spacing: .28em; text-transform: uppercase; font-size: .72rem; color: var(--gold); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 2rem; margin: 8px 0 6px; letter-spacing:.01em; }
  .rule { width: 64px; height: 2px; margin: 14px auto 10px; background: linear-gradient(90deg, transparent, var(--gold), transparent); border:0; }
  .muted { color: var(--muted); font-size: .85rem; }
  .card {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #best { border-color: var(--gold-dark); position: relative; overflow: hidden; }
  #best::before {
    content:""; position:absolute; inset:0 0 auto 0; height:3px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-light), var(--gold-dark));
  }
  .label { text-transform: uppercase; letter-spacing: .18em; font-size: .7rem; color: var(--gold); }
  .price { font-family: var(--serif); font-size: 3.2rem; font-weight: 400; color: var(--gold-light); line-height: 1.1; margin-top: 6px; }
  #meta { margin-top: 8px; font-size: 1rem; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row span:last-child { font-variant-numeric: tabular-nums; }
  .row.best span:first-child::before { content:"\2605  "; color: var(--gold); }
  .row.best span:last-child { color: var(--good); font-weight: 600; }
  .btns { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; }
  a.btn { display:inline-block; padding:12px 20px; border-radius:999px; text-decoration:none; font-weight:600; font-size:.92rem; letter-spacing:.02em; transition: transform .15s, box-shadow .15s; }
  a.btn:hover { transform: translateY(-1px); }
  a.primary { background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark)); color:#1a1408; box-shadow: 0 6px 18px rgba(201,164,92,.28); }
  a.secondary { border:1px solid var(--gold-dark); color: var(--gold-light); }
  a.secondary:hover { background: rgba(201,164,92,.08); }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 1.15rem; margin: 0 0 10px; color: var(--gold-light); }
  svg { width:100%; height:auto; display:block; }
  .scroll { overflow-x:auto; }
  .line { fill:none; stroke: var(--gold); stroke-width:2.5; }
  .dot { fill: var(--gold-light); }
  .axis { fill: var(--muted); font-size: 12px; }
  .dir { font-family: var(--serif); color: var(--gold-light); font-size: 1.05rem; margin: 14px 0 6px; }
  .dir:first-of-type { margin-top: 4px; }
  .dir small { font-family: system-ui, sans-serif; color: var(--muted); font-size: .78rem; margin-left: 8px; }
  .leg { padding: 10px 0 10px 14px; border-left: 2px solid var(--gold-dark); margin-left: 4px; }
  .leg .fl { font-size: .8rem; color: var(--muted); }
  .leg .t { margin-top: 3px; }
  .leg .t b { font-variant-numeric: tabular-nums; }
  .layover { margin: 2px 0 2px 4px; padding-left: 14px; font-size: .8rem; color: var(--gold); border-left: 2px dashed var(--line); }
  footer { text-align:center; margin-top: 34px; }
  @media (max-width: 480px) { .price { font-size: 2.6rem; } h1 { font-size: 1.6rem; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Fare watch</div>
    <h1>London &amp; Manchester to Cochin</h1>
    <hr class="rule">
    <div class="muted" id="updated">Loading…</div>
  </header>

  <div class="card" id="best" hidden>
    <div class="label">Cheapest Etihad fare right now</div>
    <div class="price" id="price"></div>
    <div id="meta" style="margin-top:6px"></div>
    <div class="muted" id="route" style="margin-top:6px"></div>
    <div class="btns">
      <a class="btn primary" id="etihad" target="_blank" rel="noopener">Book on Etihad</a>
      <a class="btn secondary" id="gf" target="_blank" rel="noopener">View this fare on Google Flights</a>
    </div>
  </div>

  <div class="card" id="flightsCard" hidden>
    <h2>Flight times</h2>
    <div id="flights"></div>
    <div class="muted" style="margin-top:12px">Times are local to each airport.</div>
  </div>

  <div class="card" id="sitesCard" hidden>
    <h2>Where to book (cheapest first)</h2>
    <div id="sites"></div>
  </div>

  <div class="card" id="histCard" hidden>
    <h2>Price history</h2>
    <div class="scroll"><svg id="chart" viewBox="0 0 700 220" role="img" aria-label="Price history"></svg></div>
  </div>

  <div class="card" id="topCard" hidden>
    <h2>Top fares found today</h2>
    <div id="top"></div>
  </div>

  <p class="muted" id="error" hidden></p>
</main>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('data.json not found yet. Run the workflow once.');
    const d = await res.json();
    const cur = d.currency || 'GBP';
    const fmt = n => cur + ' ' + Number(n).toLocaleString('en-GB');

    $('updated').textContent = 'Last updated ' + d.updated;
    $('best').hidden = false;
    $('price').textContent = fmt(d.best.price);
    $('meta').textContent = 'From ' + d.best.origin + ' · Out ' + d.best.out +
      (d.best.ret ? ' · Return ' + d.best.ret : ' · One-way');
    $('route').textContent = d.best.legs || '';
    $('etihad').href = d.etihad_url;
    if (d.best.gf_url) $('gf').href = d.best.gf_url; else $('gf').hidden = true;


    function renderItin(title, itin) {
      if (!itin || !itin.legs || !itin.legs.length) return;
      const box = $('flights');
      const h = document.createElement('div');
      h.className = 'dir';
      h.textContent = title;
      if (itin.total_duration) {
        const sm = document.createElement('small');
        sm.textContent = 'Total ' + itin.total_duration;
        h.appendChild(sm);
      }
      box.appendChild(h);
      itin.legs.forEach((l, i) => {
        const leg = document.createElement('div');
        leg.className = 'leg';
        const fl = document.createElement('div');
        fl.className = 'fl';
        fl.textContent = (l.airline ? l.airline + ' ' : '') + l.flight + (l.duration ? ' · ' + l.duration : '');
        const t = document.createElement('div');
        t.className = 't';
        const a = document.createElement('b'); a.textContent = l.from + ' ' + l.dep;
        const arrow = document.createTextNode('  \u2192  ');
        const b = document.createElement('b'); b.textContent = l.to + ' ' + l.arr;
        t.append(a, arrow, b);
        leg.append(fl, t);
        box.appendChild(leg);
        const lo = itin.layovers && itin.layovers[i];
        if (lo && i < itin.legs.length - 1) {
          const lv = document.createElement('div');
          lv.className = 'layover';
          lv.textContent = 'Layover: ' + lo.airport + (lo.duration ? ' · ' + lo.duration : '');
          box.appendChild(lv);
        }
      });
      $('flightsCard').hidden = false;
    }
    renderItin('Outbound', d.best.outbound);
    renderItin('Return', d.best.inbound);

    if (d.sites && d.sites.length) {
      $('sitesCard').hidden = false;
      $('sites').innerHTML = d.sites.map((s, i) =>
        '<div class="row' + (i === 0 ? ' best' : '') + '"><span></span><span></span></div>').join('');
      [...$('sites').children].forEach((row, i) => {
        row.children[0].textContent = d.sites[i].name;
        row.children[1].textContent = fmt(d.sites[i].price);
      });
    }

    if (d.top && d.top.length) {
      $('topCard').hidden = false;
      $('top').innerHTML = d.top.map(() => '<div class="row"><span></span><span></span></div>').join('');
      [...$('top').children].forEach((row, i) => {
        const t = d.top[i];
        row.children[0].textContent = t.origin + ' · ' + t.out + (t.ret ? ' → ' + t.ret : ' one-way');
        row.children[1].textContent = fmt(t.price);
      });
    }

    const h = d.history || [];
    if (h.length > 1) {
      $('histCard').hidden = false;
      const W = 700, H = 220, pad = 36;
      const ps = h.map(x => x.price), min = Math.min(...ps), max = Math.max(...ps);
      const span = (max - min) || 1;
      const x = i => pad + i * (W - 2 * pad) / (h.length - 1);
      const y = p => H - pad - (p - min) * (H - 2 * pad) / span;
      const pts = h.map((e, i) => x(i) + ',' + y(e.price)).join(' ');
      $('chart').innerHTML =
        '<polyline class="line" points="' + pts + '"/>' +
        h.map((e, i) => '<circle class="dot" cx="' + x(i) + '" cy="' + y(e.price) + '" r="3.5"/>').join('') +
        '<text x="4" y="' + (y(max) + 4) + '" class="axis">' + max + '</text>' +
        '<text x="4" y="' + (y(min) + 4) + '" class="axis">' + min + '</text>';
    }
  } catch (e) {
    $('updated').textContent = '';
    $('error').hidden = false;
    $('error').textContent = e.message;
  }
})();
</script>
</body>
</html>
